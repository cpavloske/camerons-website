<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #0a0e1a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 80px 100px;
      font-family: 'JetBrains Mono', monospace;
    }
    .site {
      font-size: 22px;
      color: #4e7cff;
      margin-bottom: 40px;
      letter-spacing: 0.02em;
    }
    .site span { color: #7c3aed; }
    h1 {
      font-size: 52px;
      font-weight: 700;
      color: #f0f2f8;
      line-height: 1.2;
      margin-bottom: 24px;
    }
    .tagline {
      font-size: 22px;
      color: rgba(192, 198, 210, 0.7);
      line-height: 1.5;
    }
    .border-left {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 6px;
      background: linear-gradient(180deg, #4e7cff, #7c3aed);
    }
  </style>
</head>
<body>
  <div class="border-left"></div>
  <div class="site">cam<span>.</span></div>
  <h1>Cameron Pavloske</h1>
  <div class="tagline">Senior Solutions Engineer at Neat<br>Solving the problems others work around &mdash; bringing legacy infrastructure into the modern age.</div>
</body>
</html>
