<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <!--
    Open Graph image template (1200x630).
    Query params: ?title=...&sub=...&kicker=...
    Render with headless Chrome:
      chrome --headless --screenshot=og-image.png --window-size=1200,630 "file://.../og-image.html"
  -->
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px; height: 630px; overflow: hidden; position: relative;
      background: #2b1018; color: #fbf5ef;
      font-family: 'Inter Tight', 'Helvetica Neue', Arial, sans-serif;
      padding: 72px 84px;
      display: flex; flex-direction: column; justify-content: flex-end;
    }
    .kicker {
      position: absolute; top: 64px; left: 84px;
      background: #ffb3a1; color: #4a1b0c;
      font-size: 22px; font-weight: 500;
      padding: 10px 22px; border-radius: 999px;
      transform: rotate(-4deg);
    }
    h1 {
      font-size: 96px; font-weight: 700; letter-spacing: -0.045em; line-height: 0.95;
      color: #ffb3a1; max-width: 760px;
    }
    h1.long { font-size: 64px; }
    .sub { margin-top: 26px; font-size: 26px; color: #fbf5ef; max-width: 680px; line-height: 1.35; }
    .name { margin-top: 32px; font-size: 20px; font-weight: 500; color: #a67c86; }
    .head {
      position: absolute; right: -40px; bottom: -110px; width: 500px;
      transform: rotate(-8deg);
      filter: drop-shadow(4px 0 0 #fbf5ef) drop-shadow(-4px 0 0 #fbf5ef) drop-shadow(0 4px 0 #fbf5ef) drop-shadow(0 -4px 0 #fbf5ef);
    }
    .head img { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="kicker" id="kicker">cameronpavloske.com</div>
  <h1 id="title">Cameron Pavloske</h1>
  <p class="sub" id="sub">Senior Solutions Engineer at Neat. Bringing legacy infrastructure into the future.</p>
  <p class="name" id="name"></p>
  <div class="head"><img src="img/cameron-cutout.png" alt=""></div>
  <script>
    const q = new URLSearchParams(location.search);
    const t = document.getElementById('title');
    if (q.get('title')) { t.textContent = q.get('title'); if (q.get('title').length > 24) t.classList.add('long'); document.getElementById('name').textContent = 'Cameron Pavloske'; }
    if (q.get('sub')) document.getElementById('sub').textContent = q.get('sub');
    if (q.get('kicker')) document.getElementById('kicker').textContent = q.get('kicker');
  </script>
</body>
</html>
